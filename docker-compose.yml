services:
  redis:
    image: redis:alpine
    container_name: genstore_redis
    ports:
      - "6379:6379"
  rabbitmq:
    image: rabbitmq:3-management
    container_name: genstore_rabbit
    ports:
      - "5672:5672"
      - "15672:15672"

  api:
    build: .
    container_name: genstore_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - rabbitmq
      - redis
    # REMOVED "- db" because it's not in this file

  worker:
    build: .
    container_name: genstore_worker
    command: sh -c "PYTHONPATH=. uv run celery -A app.celery_app.celery_app worker --loglevel=info"
    env_file:
      - .env
    depends_on:
      - rabbitmq
      - redis
    # REMOVED "- db" here too